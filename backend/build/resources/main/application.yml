spring:
  application:
    name: devpilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devpilot}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
            scope:
              - read:user
              - user:email
              - repo
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  ai:
    openai:
      api-key: ${AI_API_KEY:dummy-key}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  rag:
    top-k: ${RAG_TOP_K:8}
  indexing:
    max-file-size-bytes: 500000 # 500 KB limit for source parsing
    chunk-size: 80 # lines per chunk approx
    chunk-overlap: 15 # overlap lines
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

server:
  port: 8080

logging:
  level:
    com.devpilot: INFO
    org.springframework.security: WARN
